name: ABOA Inquiry Production Smoke Test

on:
  push:
    paths:
      - '.github/workflows/abao-inquiry-smoke-test.yml'

jobs:
  test-inquiry:
    runs-on: ubuntu-latest
    steps:
      - name: Submit production test inquiry
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body -sS -X POST 'https://aproposopportunity.org/api/inquiry' \
            -H 'Content-Type: application/json' \
            --data '{"name":"Jeffrey Mitchell — TEST","organization":"ABOA Website Manager Test","email":"jmitchell@aproposgroupllc.com","phone":"","state":"Nevada","inquiryType":"Procurement Intelligence","message":"PRODUCTION TEST INQUIRY — This submission verifies the Apropos Business Opportunity Agency website inquiry form, Netlify function, Resend delivery, and Reply-To configuration. No action required.","consent":true,"website":""}')
          echo "$response"
          echo "$response" | grep -q '"ok":true'
