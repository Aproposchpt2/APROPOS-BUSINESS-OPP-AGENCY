[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Reuse the exact National Enterprise Business Center hero image on the
# Apropos Business Opportunity Agency homepage. Force the redirect so the
# legacy local headquarters.webp asset does not override this route.
[[redirects]]
  from = "/headquarters.webp"
  to = "https://nebc.aproposgroupllc.com/assets/nebc-hero.webp"
  status = 302
  force = true

# Retired application routes from the previous site now return visitors
# to the Apropos Business Opportunity Agency homepage.
[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 301

[[redirects]]
  from = "/dashboard.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/login"
  to = "/"
  status = 301

[[redirects]]
  from = "/login.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/proposal"
  to = "/"
  status = 301

[[redirects]]
  from = "/proposal.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301
