[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Retired application routes from the previous site now return visitors
# to the Apropos Business Opportunity Agency homepage.
[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 301

[[redirects]]
  from = "/dashboard.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/login"
  to = "/"
  status = 301

[[redirects]]
  from = "/login.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding"
  to = "/"
  status = 301

[[redirects]]
  from = "/onboarding.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/proposal"
  to = "/"
  status = 301

[[redirects]]
  from = "/proposal.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/services"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301
