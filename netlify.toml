[build]
  command = "node scripts/validate-entity-classification.cjs"
  publish = "."

[[edge_functions]]
  function = "contact-inject"
  path = "/"

[[edge_functions]]
  function = "contact-inject"
  path = "/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Reuse the exact National Enterprise Business Center hero image on the
# BUSINESS OPPORTUNITY DEVELOPMENT AGENCY homepage. Force the redirect so the
# legacy local headquarters.webp asset does not override this route.
[[redirects]]
  from = "/headquarters.webp"
  to = "https://nebc.aproposgroupllc.com/assets/nebc-hero.webp"
  status = 302
  force = true

# Retired application routes from the previous site now return visitors
# to the BUSINESS OPPORTUNITY DEVELOPMENT AGENCY homepage.
[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 301

[[redirects]]
  from = "/dashboard.html"
  to = "/"
  status = 301

