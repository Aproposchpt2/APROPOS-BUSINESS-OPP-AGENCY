<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendor Profile | Business Opportunity Development Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#071a33;--navy2:#12375e;--gold:#c7a75a;--gold2:#ead9a5;
  --ice:#edf5fa;--paper:#fbfdff;--ink:#17283d;--muted:#66778a;--line:#cad9e4;
  --serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",Arial,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:start center;padding:calc(var(--boda-hh,72px) + 38px) 18px 60px;
  background:#081a31;
  color:#fff;font-family:var(--sans)
}
a{text-decoration:none;color:inherit}
.wrap{width:min(100%,920px)}
.card{
  overflow:hidden;border-radius:22px;background:#0f2244;
  border:1px solid rgba(199,167,90,.18);box-shadow:0 24px 65px rgba(2,11,24,.4)
}
.hero{
  position:relative;padding:42px 44px 38px;color:#fff;
  background:
    radial-gradient(circle at 86% 12%,rgba(234,217,165,.19),transparent 28%),
    linear-gradient(135deg,var(--navy),var(--navy2));
  border-bottom:4px solid var(--gold)
}
.agency{
  color:var(--gold2);font-size:9px;font-weight:800;letter-spacing:.17em;
  text-transform:uppercase;margin-bottom:26px
}
.profile-head{display:grid;grid-template-columns:92px 1fr;gap:22px;align-items:center}
.logo{
  width:92px;height:92px;border-radius:20px;display:grid;place-items:center;
  background:#f9fbfd;color:var(--navy);border:1px solid rgba(234,217,165,.75);
  font-family:var(--serif);font-size:34px
}
.verified{
  display:inline-block;margin-bottom:9px;padding:6px 9px;border-radius:999px;
  border:1px solid rgba(234,217,165,.4);color:var(--gold2);
  font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase
}
h1{font:400 47px/1 var(--serif);margin:0 0 9px}
.sub{color:#d8e4ed;font-size:14px}
.status{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.pill{
  padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
  color:#e6edf4;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase
}
.body{padding:34px 44px 38px}
.eyebrow{font-size:9px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--gold2)}
h2{font:400 29px/1.15 var(--serif);color:#fff;margin:7px 0 13px}
.panel{
  border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:21px;
  background:rgba(255,255,255,.04)
}
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.tool-card{
  display:block;padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);text-decoration:none;transition:border-color .15s,box-shadow .15s
}
.tool-card:hover{border-color:var(--gold);box-shadow:0 8px 20px rgba(2,11,24,.3)}
.tool-card strong{display:block;color:#fff;font:600 14px var(--sans);margin-bottom:6px}
.tool-card span{display:block;color:rgba(255,255,255,.62);font-size:11.5px;line-height:1.5}
@media(max-width:700px){.tool-grid{grid-template-columns:1fr}}
.fact{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.fact:last-child{border-bottom:0}
.fact small{display:block;color:rgba(255,255,255,.5);font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.fact strong{display:block;margin-top:4px;color:#fff;font-size:12px}
.engage{
  margin-top:20px;padding:22px 24px;border-radius:14px;
  background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
  display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap
}
.engage strong{display:block;font:400 22px var(--serif)}
.engage span{display:block;color:#cbd9e5;font-size:11px;margin-top:5px}
.button{
  flex:none;background:var(--gold);color:var(--navy);padding:13px 16px;border-radius:8px;
  font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  text-decoration:none;display:inline-block;border:none;cursor:pointer
}
.button-outline{
  flex:none;background:none;color:#fff;padding:13px 16px;border-radius:8px;
  font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.2);cursor:pointer;margin-top:10px;width:100%
}
.claim-cta{
  margin-top:20px;padding:20px 24px;border-radius:14px;border:1px solid rgba(199,167,90,.4);
  background:rgba(199,167,90,.06);
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap
}
.claim-cta strong{display:block;font:600 15px var(--sans);color:#fff}
.claim-cta span{display:block;color:rgba(255,255,255,.62);font-size:12px;margin-top:4px}
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(7,26,51,.55);align-items:center;justify-content:center;padding:20px;z-index:50
}
.modal-overlay.open{display:flex}
.modal{width:min(100%,440px);background:#0f2244;border-radius:16px;padding:28px;box-shadow:0 30px 70px rgba(2,11,24,.5)}
.modal h2{font:500 1.6rem var(--serif);color:#fff;margin:6px 0 16px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:rgba(255,255,255,.68);line-height:1.6;margin-bottom:14px}
.consent input{margin-top:3px}
.modal-status{font-size:13px;margin-bottom:10px;min-height:0}
.modal-status.error{color:#8b1e1e}
.opportunity{
  margin-top:26px;border-radius:16px;overflow:hidden;
  border:1px solid var(--gold);
  background:rgba(255,255,255,.04)
}
.opportunity-head{
  padding:18px 24px;background:linear-gradient(135deg,var(--navy),var(--navy2));
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap
}
.opportunity-head .eyebrow{color:var(--gold2);margin:0}
.opportunity-head .live{
  padding:6px 10px;border-radius:999px;background:var(--gold);color:var(--navy);
  font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase
}
.opportunity-body{padding:22px 24px}
.opportunity-body h2{margin:2px 0 16px}
.opp-facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.opp-facts .fact{border-bottom:0;padding:0}
@media(max-width:700px){.opp-facts{grid-template-columns:1fr}}
.opp-title{font:400 22px/1.25 var(--serif);color:#fff;margin:4px 0 18px}
.opp-scope{margin:4px 0 20px;padding-top:16px;border-top:1px solid #dfe8ee}
.opp-scope small{display:block;color:#7c8997;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}
.opp-scope p{margin:0;color:rgba(255,255,255,.72);font-size:13px;line-height:1.75}
.opp-link{margin-top:6px}
.snapshot-block{margin-top:18px}
.snapshot-block:first-child{margin-top:0}
.snapshot-block>small{display:block;color:#7c8997;font-size:8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px}
.snapshot-facts{flex:1;min-width:200px;display:flex;flex-direction:column}
.snapshot-tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap}
.tag.cert{background:rgba(199,167,90,.12);border-color:var(--gold);color:var(--gold2);font-weight:700}
.panel+.panel,.panel+.opportunity,.opportunity+.panel{margin-top:18px}
.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
.contact-grid .fact{border-bottom:0;padding:0}.contact-grid a{color:var(--gold2);text-decoration:underline}
.owner-panel{border-color:var(--gold);background:rgba(199,167,90,.07)}
.owner-panel h2{margin-bottom:16px}
.contact-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact-form label{display:flex;flex-direction:column;gap:7px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.contact-form label span{text-transform:none;letter-spacing:0;font-weight:500}
.contact-form .wide{grid-column:1/-1}
.contact-form input,.contact-form textarea{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;padding:12px;font:inherit;font-size:14px;letter-spacing:0;text-transform:none;font-weight:400;outline:none;resize:vertical}
.contact-form input:focus,.contact-form textarea:focus{border-color:var(--gold)}
.contact-form .button{grid-column:1/-1;justify-self:start}
.cf-msg{grid-column:1/-1;font-size:13px}.cf-msg.ok{color:var(--gold2)}.cf-msg.bad{color:#ff9999}
@media(max-width:700px){.contact-grid,.contact-form{grid-template-columns:1fr}.contact-form .button{justify-self:stretch}}
[hidden]{display:none!important}
.survey-panel{border-color:rgba(199,167,90,.45)}
.rate{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rate legend{width:100%;margin-bottom:8px;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.rate-opt{flex-direction:row!important}.rate-opt input{position:absolute;opacity:0;pointer-events:none}
.rate-opt span{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;font-size:16px;font-weight:700;letter-spacing:0;cursor:pointer}
.rate-opt input:checked+span{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.rate-opt input:focus-visible+span{outline:2px solid var(--gold2);outline-offset:2px}
.rate-key{margin:-4px 0 0;font-size:11px;color:rgba(255,255,255,.5)}
.editor-offer{padding:6px 2px}.editor-offer p{color:rgba(255,255,255,.72);font-size:13px;line-height:1.65;margin:0 0 16px}
.offer-price{font:400 2.4rem var(--serif);color:#fff;margin:0 0 8px}.offer-price span{font:500 14px var(--sans);color:rgba(255,255,255,.6)}
.card-url{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0 18px;padding:12px 14px;border-radius:10px;background:rgba(2,11,24,.35);font-size:13px;color:rgba(255,255,255,.7)}
.card-url a{color:var(--gold2);text-decoration:underline;word-break:break-all}
.card-url .copy-btn{width:auto;margin:0;padding:8px 12px}
.opp-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}.opp-actions .button-outline{width:auto;margin:0}
/* Print Contract prints only the contract card on white paper. */
@media print{
  body.print-contract{background:#fff!important}
  body.print-contract .boda-header,body.print-contract .hero,body.print-contract .footer,body.print-contract .body>*:not(.opportunity),body.print-contract .opp-actions,body.print-contract #oppMsg,body.print-contract .modal-overlay{display:none!important}
  body.print-contract .card,body.print-contract .opportunity,body.print-contract .opportunity-body{background:#fff!important;border:0!important;box-shadow:none!important}
  body.print-contract .opportunity-head{background:#081a31!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-contract .opp-title,body.print-contract .fact strong,body.print-contract .opp-scope p{color:#000!important}
  body.print-contract .fact small,body.print-contract .opp-scope small{color:#555!important}
}
.footer{
  text-align:center;padding:18px;background:rgba(2,11,24,.3);color:rgba(255,255,255,.45);
  font-size:9px;letter-spacing:.04em;border-top:1px solid rgba(255,255,255,.1)
}
.footer strong{color:rgba(255,255,255,.72)}
.missing{max-width:640px;margin:90px auto;padding:30px;text-align:center;color:var(--navy)}
.missing h1{font:400 3rem var(--serif)}
@media(max-width:700px){
  .hero,.body{padding-left:24px;padding-right:24px}
  .profile-head{grid-template-columns:1fr}
  .engage{align-items:flex-start;flex-direction:column}
  h1{font-size:39px}
}
:root{--boda-hh:72px}body.nav-open{overflow:hidden}.boda-header{position:fixed;inset:0 0 auto 0;z-index:9000;height:var(--boda-hh);background:rgba(2,11,24,.95);border-bottom:1px solid rgba(199,167,90,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff}.boda-hinner{max-width:1380px;height:100%;margin:0 auto;padding:0 max(24px,4vw);display:flex;align-items:center;justify-content:space-between;gap:32px}.boda-brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;flex-shrink:0}.boda-rule{width:2px;height:36px;background:linear-gradient(#ead9a5,#c7a75a);flex-shrink:0}.boda-brand strong{display:block;font-size:.78rem;letter-spacing:.18em;font-weight:700;line-height:1}.boda-brand em{display:block;margin-top:5px;font-style:normal;font-size:.5rem;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.6)}.boda-nav{display:flex;align-items:center;gap:20px}.boda-nav a{text-decoration:none;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.72);white-space:nowrap;transition:color .2s}.boda-nav a:hover,.boda-nav a[aria-current]{color:#fff}.boda-nav .boda-cta{padding:10px 14px;border:1px solid rgba(229,207,154,.5);color:#ead9a5}.boda-toggle{display:none;background:transparent;border:0;color:#fff;cursor:pointer;font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;font-family:inherit;font-weight:600;padding:10px 0;flex-shrink:0}@media(max-width:860px){.boda-header{backdrop-filter:none;-webkit-backdrop-filter:none}body.nav-open .boda-header{background:#020b18}.boda-toggle{display:block}.boda-nav{position:fixed;inset:var(--boda-hh) 0 0 0;height:calc(100vh - var(--boda-hh));height:calc(100dvh - var(--boda-hh));box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;background:#020b18;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:32px max(32px,8vw) max(32px,env(safe-area-inset-bottom));gap:26px;opacity:0;visibility:hidden;transform:translateY(-12px);transition:.22s ease}.boda-nav.open{opacity:1;visibility:visible;transform:none}.boda-nav a{font-size:.78rem;flex-shrink:0;min-height:44px;display:flex;align-items:center}.boda-nav .boda-cta{padding:12px 0;border:0;border-bottom:1px solid rgba(229,207,154,.28)}}@media(max-width:480px){.boda-brand strong{font-size:.66rem;letter-spacing:.12em}}
</style>
</head>
<body>
<header class="boda-header" id="bodaHeader">
  <div class="boda-hinner">
    <a class="boda-brand" href="/" aria-label="Business Opportunity Development Agency home">
      <span class="boda-rule" aria-hidden="true"></span>
      <span><strong>BUSINESS OPPORTUNITY DEVELOPMENT AGENCY</strong></span>
    </a>
    <button class="boda-toggle" id="bodaToggle" type="button" aria-expanded="false" aria-controls="bodaNav">Menu</button>
    <nav class="boda-nav" id="bodaNav" aria-label="Site navigation">
      <a href="/">Home</a>
      <a href="/contract-preparedness">Contract Preparedness</a>
      
      <a href="/business-development-marketing-engine">Marketing Engine</a>
      <a class="boda-cta" href="/claim">Claim an Opportunity</a>
    </nav>
  </div>
</header>
<div class="wrap" id="app"></div>
<script>
(()=>{'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('slug')||'');
const app=document.getElementById('app');
function initials(name){return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'BV'}
function fact(label,value){return value?'<div class="fact"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong></div>':''}
function fact2(label,value){return value?'<div class="fact" style="flex:1;min-width:140px"><small>'+esc(label)+'</small><strong>'+esc(value)+'</strong></div>':''}
function date(v){if(!v)return'';const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleDateString('en-US',{dateStyle:'long'})}

// No outbound "Open Authoritative Procurement Site" button (Jeff, 2026-10-13): leaving the site
// loses the follow-on survey and offers. The owner keeps the contract via Print / Download.
function opportunityCard(o,owner){
  if(!o||typeof o!=='object')return'';
  if(!o.title&&!o.agency_name&&!o.solicitation_number)return'';
  return '<div class="opportunity" id="opportunityCard"><div class="opportunity-head"><div class="eyebrow">Current Contract Opportunity</div><div class="live">Open For Bid</div></div>'
    +'<div class="opportunity-body"><div class="opp-title">'+esc(o.title||'Government Contract Opportunity')+'</div>'
    +'<div class="opp-facts">'+fact('Agency',o.agency_name)+fact('Solicitation #',o.solicitation_number)+fact('Response Deadline',date(o.response_deadline))+fact('Location',o.place_of_performance)+'</div>'
    +(o.scope_summary?'<div class="opp-scope"><small>Scope Of Work</small><p>'+esc(o.scope_summary)+'</p></div>':'')
    +(owner?'<div class="opp-actions"><button class="button" type="button" id="downloadPdf">Download Contract (PDF)</button><button class="button-outline" type="button" id="printContract">Print Contract</button></div><div id="oppMsg" class="cf-msg" role="status" aria-live="polite"></div>':'')
    +'</div></div>';
}
function loadScript(src){return new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('The download tool could not load. Please try again.'));document.head.appendChild(s)})}
async function downloadContractPdf(o,business){
  if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const doc=new window.jspdf.jsPDF({unit:'pt',format:'letter'}),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),L=54,R=W-54;let y=0;
  const need=h=>{if(y+h>H-60){doc.addPage();y=60}};
  const para=(t,size=10.5,gap=6)=>{doc.setFont('helvetica','normal');doc.setFontSize(size);doc.setTextColor(30,41,59);doc.splitTextToSize(String(t||''),R-L).forEach(line=>{need(size+4);doc.text(line,L,y);y+=size+4});y+=gap};
  const head=t=>{need(34);y+=8;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(8,26,49);doc.text(t,L,y);y+=6;doc.setDrawColor(199,167,90);doc.setLineWidth(1);doc.line(L,y,R,y);y+=16};
  doc.setFillColor(8,26,49);doc.rect(0,0,W,96,'F');doc.setFillColor(199,167,90);doc.rect(0,96,W,4,'F');
  doc.setTextColor(234,217,165);doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text('BUSINESS OPPORTUNITY DEVELOPMENT AGENCY  ·  COMPLIMENTARY CONTRACT OPPORTUNITY',L,34);
  doc.setTextColor(255,255,255);doc.setFont('times','normal');doc.setFontSize(20);doc.splitTextToSize(o.title||'Government Contract Opportunity',R-L).slice(0,2).forEach((t,i)=>doc.text(t,L,60+i*22));
  y=128;
  if(business)para('Prepared for '+business,10,4);
  head('Opportunity Details');
  [['Agency',o.agency_name],['Solicitation',o.solicitation_number],['Response Deadline',date(o.response_deadline)],['Location',o.place_of_performance],['NAICS',o.naics]].filter(r=>r[1]).forEach(([k,v])=>{need(18);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(100,116,139);doc.text(k.toUpperCase(),L,y);doc.setFont('helvetica','normal');doc.setTextColor(15,23,42);doc.splitTextToSize(String(v),R-L-150).forEach((t,i)=>{if(i)need(14);doc.text(t,L+150,y);y+=14});y+=2});
  head('Scope of Work');para(o.scope_summary||'See the official solicitation for the complete scope.');
  head('Official Solicitation');para('The issuing authority is the source of truth. Review all solicitation documents, amendments, forms, instructions, and submission requirements at:');
  if(o.authoritative_url){doc.setTextColor(15,42,106);doc.setFontSize(10);need(16);doc.textWithLink(o.authoritative_url.slice(0,95),L,y,{url:o.authoritative_url});y+=18}
  const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,130,145);doc.text('Business Opportunity Development Agency · A property of Apropos Group LLC · aproposopportunity.org',L,H-30);doc.text('Page '+i+' of '+pages,R,H-30,{align:'right'})}
  doc.save(((o.solicitation_number||o.title||'Contract').replace(/[^A-Za-z0-9-]+/g,'_').slice(0,60))+'_Contract_Opportunity.pdf');
}

async function load(){
  try{
    const r=await fetch('/api/vendor-presence?action=public&slug='+encodeURIComponent(slug),{cache:'no-store'});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error('This Vendor Page is not currently published.');
    const p=d.profile;
    document.title=p.business_name+' | Business Opportunity Development Agency';
    const loc=[p.city,p.state].filter(Boolean).join(', ');
    const caps=(p.core_capabilities||[]).slice(0,6);
    const certs=(p.certifications||[]).slice(0,10);
    const mail=p.public_contact_email?'mailto:'+encodeURIComponent(p.public_contact_email):'';

    const opportunityHtml=opportunityCard(p.claimed_opportunity,d.owner);
    const cardUrl=location.origin+'/vendor/'+encodeURIComponent(p.slug);
    const services=(p.products_services||[]).filter(Boolean);
    const contactHtml=(p.public_contact_email||p.phone||services.length||p.hours_of_operation)
      ?'<div class="panel contact-panel"><div class="eyebrow">Contact &amp; Services</div><div class="contact-grid">'
        +(p.public_contact_email?'<div class="fact"><small>Business Email</small><strong><a href="mailto:'+esc(p.public_contact_email)+'">'+esc(p.public_contact_email)+'</a></strong></div>':'')
        +(p.phone?'<div class="fact"><small>Business Phone</small><strong><a href="tel:'+esc(String(p.phone).replace(/[^0-9+]/g,''))+'">'+esc(p.phone)+'</a></strong></div>':'')
        +(p.hours_of_operation?'<div class="fact"><small>Hours of Operation</small><strong style="white-space:pre-line">'+esc(p.hours_of_operation)+'</strong></div>':'')
        +'</div>'+(services.length?'<div class="snapshot-block"><small>Services</small><div class="snapshot-tags">'+services.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div></div>':'')+'</div>'
      :'';
    // Vendor Card window for the owner (per Jeff 2026-10-13): preferred contact information form.
    const ownerForm=d.owner
      ?'<div class="panel owner-panel" id="ownerPanel"><div class="eyebrow">Your Vendor Card</div>'
        +'<div class="card-url"><span>Here&rsquo;s your Vendor Card URL:</span><a href="'+esc(cardUrl)+'" id="cardUrl">'+esc(cardUrl)+'</a><button class="button-outline copy-btn" type="button" id="copyUrl">Copy</button></div>'
        +'<h2>Add your preferred contact information</h2>'
        +'<form id="contactForm" class="contact-form">'
        +'<label>Business Email<input id="cf_email" type="email" autocomplete="email" value="'+esc(p.public_contact_email||'')+'"></label>'
        +'<label>Business Contact Phone Number<input id="cf_phone" type="tel" autocomplete="tel" value="'+esc(p.phone||'')+'"></label>'
        +'<label class="wide">Services <span>(one per line)</span><textarea id="cf_services" rows="4">'+esc(services.join('\n'))+'</textarea></label>'
        +'<label class="wide">Hours of Operation<textarea id="cf_hours" rows="3" placeholder="Mon–Fri 8:00 AM – 5:00 PM">'+esc(p.hours_of_operation||'')+'</textarea></label>'
        +'<button class="button" type="submit" id="cf_save">Save to My Vendor Card</button><div id="cf_msg" class="cf-msg" role="status" aria-live="polite"></div>'
        +'</form></div>'
      :'';

    app.innerHTML='<article class="card">'
      +'<section class="hero"><div class="agency">Business Opportunity Development Agency &middot; Vendor Presence</div>'
      +'<div class="profile-head"><div class="logo"'+(p.logo_url?' style="background-image:url('+encodeURI(p.logo_url)+');background-size:cover;background-position:center;color:transparent"':'')+'>'+esc(initials(p.business_name))+'</div>'
      +'<div><div class="verified">Verified Agency Vendor</div><h1>'+esc(p.business_name)+'</h1>'+(loc?'<div class="sub">'+esc(loc)+'</div>':'')+'</div></div>'
      +'<div class="status">'+(p.sam_registration_status?'<div class="pill">SAM '+esc(p.sam_registration_status)+'</div>':'')+(caps.length?'<div class="pill">Capability Profile Active</div>':'')+'</div>'
      +'</section>'
      +'<section class="body">'
      +ownerForm
      +opportunityHtml
      +contactHtml
      // Owner-only approach survey, then the Vendor Card Editor subscription (Jeff, 2026-10-13).
      +(d.owner?'<div class="panel survey-panel" id="surveyPanel"><div class="eyebrow">Your Feedback</div><h2>SHARE YOUR OPINION OF OUR APPROACH</h2>'
        +'<form id="approachSurvey" class="contact-form">'
        +'<fieldset class="rate wide"><legend>Rate our Approach</legend>'+[1,2,3,4,5].map(n=>'<label class="rate-opt"><input type="radio" name="approach" value="'+n+'" required><span>'+n+'</span></label>').join('')+'</fieldset>'
        +'<fieldset class="rate wide"><legend>Rate the current procurement process</legend>'+[1,2,3,4,5].map(n=>'<label class="rate-opt"><input type="radio" name="process" value="'+n+'" required><span>'+n+'</span></label>').join('')+'</fieldset>'
        +'<p class="rate-key wide">1 = Poor &nbsp;·&nbsp; 5 = Excellent</p>'
        +'<label class="wide">Any additional comment?<textarea id="sv_comment" rows="3" maxlength="2000"></textarea></label>'
        +'<button class="button" type="submit" id="sv_submit">Submit</button><div id="sv_msg" class="cf-msg" role="status" aria-live="polite"></div>'
        +'</form>'
        +'<div id="editorOffer" class="editor-offer" hidden><div class="eyebrow">Thank you for your feedback</div><h2>Vendor Card Editor</h2>'
        +'<div class="offer-price">$19.99<span>/month</span></div>'
        +'<p>Your Vendor Card is live at no cost. Subscribe to the Vendor Card Editor to update your headline, about, capabilities, NAICS, certifications, logo, and contact details any time.</p>'
        +'<a class="button" href="https://ai4-product-purchasing.ai4businesses.org/boda-vendor-card" target="_blank" rel="noopener">Subscribe — $19.99/mo</a></div>'
        +'</div>':'')
      // Business Snapshot shows only when there is registration or capability data to show.
      +(caps.length||certs.length||p.sam_registration_status||p.uei?'<div class="panel"><div class="eyebrow">Business Snapshot</div>'
        +(caps.length?'<div class="snapshot-block"><small>Capabilities</small><div class="snapshot-tags">'+caps.map(x=>'<span class="tag">'+esc(x)+'</span>').join('')+'</div></div>':'')
        +(certs.length?'<div class="snapshot-block"><small>Certifications &amp; Designations</small><div class="snapshot-tags">'+certs.map(x=>'<span class="tag cert">'+esc(x)+'</span>').join('')+'</div></div>':'')
        +(p.sam_registration_status||p.uei?'<div class="snapshot-block"><small>Registration</small><div class="snapshot-facts" style="flex-direction:row;gap:24px;flex-wrap:wrap">'+fact2('SAM Status',p.sam_registration_status)+fact2('UEI',p.uei)+'</div></div>':'')
        +'</div>':'')
      +(d.owner?'':'<div class="claim-cta"><div><strong>Claim Your Business</strong><span>Confirm your Vendor Page and continue to your personalized Opportunity Dashboard.</span></div>'
      +'<button class="button" id="claimBizBtn">Claim Your Business →</button></div>')
      // Buyer-facing contact band: public visitors only.
      +(d.owner?'':'<div class="engage"><div><strong>Connect with '+esc(p.business_name)+'.</strong><span>Customers, buyers, primes and teaming partners can engage directly with this business.</span></div>'
      +(mail?'<a class="button" href="'+mail+'">'+esc(p.customer_cta_label||'Contact This Business')+'</a>':(p.website?'<a class="button" href="'+esc(p.website)+'">Visit Business Website</a>':''))
      +'</div>')
      +'</section>'
      +'<footer class="footer"><strong>BUSINESS OPPORTUNITY DEVELOPMENT AGENCY</strong><br>A property of Apropos Group LLC</footer>'
      +'</article>'
      +'<div class="modal-overlay" id="claimModalOverlay"><div class="modal">'
      +'<div class="eyebrow">Claim This Business — Free</div><h2>Claim Your Business</h2>'
      +'<label class="consent"><input type="checkbox" id="registryConsent"> Authorize Business Opportunity Development Agency to add '+esc(p.business_name)+' to our Vendor Registry for public search view.</label>'
      +'<div id="claimModalStatus" class="modal-status"></div>'
      +'<button class="button" id="confirmClaimBtn">Confirm &amp; Continue →</button>'
      +'<button class="button-outline" id="cancelClaimBtn">Cancel</button>'
      +'</div></div>';

    document.getElementById('copyUrl')?.addEventListener('click',async e=>{
      try{await navigator.clipboard.writeText(cardUrl);e.currentTarget.textContent='Copied'}catch{e.currentTarget.textContent='Select & copy'}
    });
    document.getElementById('downloadPdf')?.addEventListener('click',async e=>{
      const btn=e.currentTarget,m=document.getElementById('oppMsg');btn.disabled=true;btn.textContent='PREPARING PDF…';
      try{await downloadContractPdf(p.claimed_opportunity||{},p.business_name);m.textContent='Your contract PDF has been downloaded.';m.className='cf-msg ok'}
      catch(err){m.textContent=err.message||'The PDF could not be created. Please try again.';m.className='cf-msg bad'}
      finally{btn.disabled=false;btn.textContent='Download Contract (PDF)'}
    });
    document.getElementById('printContract')?.addEventListener('click',()=>{
      const m=document.getElementById('oppMsg');document.body.classList.add('print-contract');
      window.addEventListener('afterprint',()=>{document.body.classList.remove('print-contract');m.textContent='Your contract was sent to print.';m.className='cf-msg ok'},{once:true});
      window.print();
    });
    const sv=document.getElementById('approachSurvey');
    if(sv){
      if(sessionStorage.getItem('bodaApproachSurvey')===p.slug){sv.hidden=true;document.getElementById('editorOffer').hidden=false}
      sv.addEventListener('submit',async e=>{
        e.preventDefault();
        const pick=n=>sv.querySelector('input[name="'+n+'"]:checked')?.value,btn=document.getElementById('sv_submit'),msg=document.getElementById('sv_msg');
        if(!pick('approach')||!pick('process')){msg.textContent='Please choose a rating for both questions.';msg.className='cf-msg bad';return}
        btn.disabled=true;btn.textContent='SUBMITTING…';msg.textContent='';msg.className='cf-msg';
        try{
          const r=await fetch('/api/vendor-presence?action=survey',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rating:Number(pick('approach')),process_rating:Number(pick('process')),comment:document.getElementById('sv_comment').value.trim(),action:'approach-survey'})});
          const x=await r.json().catch(()=>({}));
          if(!r.ok||!x.ok)throw new Error(x.error||'Your feedback could not be saved. Please try again.');
          try{sessionStorage.setItem('bodaApproachSurvey',p.slug)}catch{}
          sv.hidden=true;const offer=document.getElementById('editorOffer');offer.hidden=false;offer.scrollIntoView({behavior:'smooth',block:'center'});
        }catch(err){msg.textContent=err.message;msg.className='cf-msg bad';btn.disabled=false;btn.textContent='Submit'}
      });
    }
    const cf=document.getElementById('contactForm');
    if(cf){
      if(new URLSearchParams(location.search).get('setup'))document.getElementById('ownerPanel').scrollIntoView({block:'start'});
      cf.addEventListener('submit',async e=>{
        e.preventDefault();
        const btn=document.getElementById('cf_save'),msg=document.getElementById('cf_msg');
        btn.disabled=true;btn.textContent='SAVING…';msg.textContent='';msg.className='cf-msg';
        try{
          const r=await fetch('/api/vendor-presence?action=contact-save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
            public_contact_email:document.getElementById('cf_email').value.trim(),
            phone:document.getElementById('cf_phone').value.trim(),
            products_services:document.getElementById('cf_services').value,
            hours_of_operation:document.getElementById('cf_hours').value.trim()})});
          const x=await r.json().catch(()=>({}));
          if(!r.ok||!x.ok)throw new Error(x.error||'Your details could not be saved. Please try again.');
          msg.textContent='Saved. Your Vendor Card is updated.';msg.className='cf-msg ok';
          setTimeout(load,900);
          return;
        }catch(err){msg.textContent=err.message;msg.className='cf-msg bad'}
        finally{btn.disabled=false;btn.textContent='Save to My Vendor Card'}
      });
    }
    const overlay=document.getElementById('claimModalOverlay');
    document.getElementById('claimBizBtn')?.addEventListener('click',()=>overlay.classList.add('open'));
    document.getElementById('cancelClaimBtn').addEventListener('click',()=>overlay.classList.remove('open'));
    document.getElementById('confirmClaimBtn').addEventListener('click',async()=>{
      const statusEl=document.getElementById('claimModalStatus');
      if(!document.getElementById('registryConsent').checked){
        statusEl.textContent='Please check the box to authorize your listing.';
        statusEl.className='modal-status error';
        return;
      }
      const btn=document.getElementById('confirmClaimBtn');
      btn.disabled=true;btn.textContent='CONFIRMING…';
      try{
        const r=await fetch('/api/vendor-presence?action=authorize-registry',{method:'POST'});
        if(r.status===401){
          statusEl.textContent='Your claim session has expired. Please claim this business again from your original link.';
          statusEl.className='modal-status error';
          btn.disabled=false;btn.textContent='Confirm & Continue →';
          return;
        }
        const d=await r.json().catch(()=>null);
        if(!r.ok||!d?.ok)throw new Error('Could not confirm. Please try again.');
        location.assign('/vendor-dashboard');
      }catch(e){
        statusEl.textContent=e.message||'Could not confirm. Please try again.';
        statusEl.className='modal-status error';
        btn.disabled=false;btn.textContent='Confirm & Continue →';
      }
    });
  }catch(e){
    app.innerHTML='<div class="missing"><h1>Vendor Page</h1><p>'+esc(e.message)+'</p></div>';
  }
}
load();
})();
</script>
<script>(function(){var t=document.getElementById('bodaToggle'),n=document.getElementById('bodaNav');if(!t||!n)return;t.addEventListener('click',function(){var o=n.classList.toggle('open');document.body.classList.toggle('nav-open',o);t.setAttribute('aria-expanded',String(o));t.textContent=o?'Close':'Menu';});n.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){n.classList.remove('open');document.body.classList.remove('nav-open');t.setAttribute('aria-expanded','false');t.textContent='Menu';});});}());</script>
</body>
</html>
